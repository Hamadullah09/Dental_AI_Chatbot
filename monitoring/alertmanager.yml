# Phase 3 alerting config. PLACEHOLDER webhook/routing - this will not actually notify
# anyone until real Slack/PagerDuty credentials are filled in below. Wiring real
# credentials is a decision for whoever owns on-call for this product, not something to
# invent here.
#
# To wire Slack: replace slack_api_url below with an incoming webhook URL
# (https://api.slack.com/messaging/webhooks) and set channel/username as desired.
# To wire PagerDuty: add a pagerduty_configs block with a real service integration key
# under the 'critical' receiver instead of (or alongside) Slack.

global:
  resolve_timeout: 5m
  # slack_api_url: 'https://hooks.slack.com/services/REPLACE/WITH/REAL_WEBHOOK'

route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
