name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dental_ai_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Lint with ruff
        run: |
          ruff check app/ --output-format=github
          ruff format --check app/

      # Phase 6: `mypy ... || true` never failed the build regardless of how many errors
      # existed. The codebase has ~166 pre-existing type errors concentrated in legacy
      # modules this hardening pass didn't touch (app/services/rag.py, dashboard.py,
      # settings.py, dental_records.py) - fixing all of them blind, under this pass's scope,
      # risks introducing behavior bugs worse than the status quo. Instead this is a ratchet
      # (see scripts/mypy_baseline_gate.py and mypy_baseline.txt): the build now genuinely
      # fails if a change introduces new type errors beyond the committed baseline, and the
      # baseline is meant to be lowered over time as legacy modules get cleaned up.
      - name: Type check with mypy (baseline gate)
        run: python scripts/mypy_baseline_gate.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://dental:test-password@localhost:5432/dental_ai_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: testing
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

      # Phase 5/6: retrieval/citation quality gate (scripts/evaluate_rag.py + the 30-case
      # docs/evaluation_dataset.jsonl already existed but were never run anywhere before
      # this). No Qdrant service runs in this job, so this currently always skips - it's
      # wired in now, ready to become a real gate the moment a populated Qdrant fixture is
      # added here (see scripts/ci_retrieval_gate.py's docstring for exactly how).
      - name: Retrieval quality gate (skips if no Qdrant data is reachable)
        env:
          DATABASE_URL: postgresql+psycopg://dental:test-password@localhost:5432/dental_ai_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: testing
        run: |
          python scripts/ci_retrieval_gate.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "safety==3.*" "bandit[toml]"

      # Phase 6: both scanners used to run with `|| true`, so neither could ever fail the
      # build no matter what they found. Fixed/suppressed-with-reason findings and the
      # rationale for what's excluded live in pyproject.toml's [tool.bandit] (skips B110,
      # the deliberate fail-open try/except/pass pattern) and .safety-policy.yml (the two
      # ecdsa findings, unreachable here since JWTs are signed HS256/hmac, not EC - see
      # that file for the full explanation). Both are now real gates.
      #
      # safety scans a `pip freeze` of the resolved install, not requirements.txt directly:
      # safety's default `ignore-unpinned-requirements: true` silently drops every finding
      # against a floating spec like `cryptography>=42.0.0` (this project's pinning style),
      # so scanning requirements.txt as-is always falsely reports 0 vulnerabilities.
      - name: Security scan (bandit + safety, blocking)
        run: |
          bandit -c pyproject.toml -r app/ -f json -o bandit-report.json
          pip freeze > frozen-requirements.txt
          safety check -r frozen-requirements.txt --policy-file .safety-policy.yml

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dental-ai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: dental-ai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deployment would happen here"
          echo "SSH to server and run docker-compose pull && docker-compose up -d"

      - name: Health check
        run: |
          sleep 30
          curl -fsS http://localhost:8000/api/health || echo "Health check failed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to previous version"
          echo "docker-compose down && docker-compose -f docker-compose.prev.yml up -d"
